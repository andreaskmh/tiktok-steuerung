  const e = pts[pts.length - 1];
  document.getElementById('verlauf').innerHTML = `<defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <path d="${glatt} L${W},96 L0,96 Z" fill="url(#fl)"/><path d="${glatt}" fill="none" stroke="#fff" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`;
  const tag = t => new Date(t + 'T12:00').toLocaleDateString('de-DE', {day: 'numeric', month: 'short'});
  document.getElementById('achse').innerHTML = `<span>${tag(v[0].tag)}</span><span class="mitteL">Letzte 30 Tage</span><span>${tag(e && v[v.length - 1].tag)}</span>`;
  // Kacheln
  document.getElementById('kacheln').innerHTML = [
    ['ok', 'Ausgezahlt', eur(z.ausgezahlt), ''], ['uhr', 'Noch offen', eur(z.offen), zahl(z.offen_anzahl) + ' Bestellungen'],
    ['gift', 'Prämien', eur(z.praemien), ''], ['x', 'Nicht berechtigt', z.quote_prozent.toLocaleString('de-DE') + ' %', eur(z.verloren) + ' entgangen']
  ].map(([s, t, w, u]) => `<div class="kachel">${sym(s)}<div><div class="t">${t}</div><div class="w">${w}</div><div class="u">${u}</div></div></div>`).join('');
  // Rangliste
  const rang = document.getElementById('rang'), andere = D.konten.slice(1);
  rang.hidden = k.name !== 'Alle Accounts';
  const m30 = Math.max(...andere.map(x => x.zeitraeume.tage30.provision), 1);
  rang.innerHTML = `<h2>Accounts <small>voraussichtlich, 30 Tage</small></h2>` + andere.map(x => { const r = x.zeitraeume;
    return `<button class="zeile" data-k="${esc(x.name)}">${ava(x)}<div class="mitte"><div style="display:flex;justify-content:space-between;gap:10px"><span class="n" style="font-weight:600">${esc(x.name)}</span><span class="b">${eur(r.tage30.provision)}</span></div>
    <div class="balken"><i style="width:${(r.tage30.provision / m30 * 100).toFixed(1)}%"></i></div><div class="s">Heute ${eur(r.heute.provision)} · Gestern ${eur(r.gestern.provision)} · 7 T ${eur(r.tage7.provision, true)}</div></div></button>` }).join('');
  // Monate
  document.getElementById('monate').innerHTML = `<h2>Nach Bestellmonat <small>% abgeschlossen</small></h2>` + k.bestellmonate.slice().reverse().map(m => {
    const a = m.fertig_prozent / 100, c = 2 * Math.PI * 15, f = a >= .95 ? 'var(--gut)' : 'var(--warn)';
    return `<div class="zeile"><svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="15" fill="none" stroke="var(--spur)" stroke-width="4"/><circle cx="19" cy="19" r="15" fill="none" stroke="${f}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * a).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 19 19)"/><text x="19" y="22.5" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)" font-family="Manrope, sans-serif">${Math.floor(m.fertig_prozent)}</text></svg>
    <div class="mitte"><div class="n" style="font-weight:600">${monat(m.monat, true)}${m.monat === laufend ? '<span class="pill">läuft</span>' : ''}</div><div class="s">${zahl(m.bestellungen)} Bestellungen</div></div>
    <div style="text-align:right"><div class="b">${eur(m.vorauss)}</div><div class="s">${m.offen > 0 ? eur(m.offen) + ' offen' : 'komplett'}</div></div></div>` }).join('');
  // Auszahlungen
  const am = k.auszahlmonate, mx = Math.max(...am.map(m => m.betrag), 1), bw = 600 / Math.max(am.length, 1);
  document.getElementById('auszahl').innerHTML = `<h2>Auszahlungen <small>pro Monat</small></h2><svg class="bars" viewBox="0 0 600 190" role="img" aria-label="Auszahlungen pro Monat">
    <defs><linearGradient id="bg1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--akzent)"/><stop offset="1" stop-color="var(--akzent2)"/></linearGradient></defs>` +
    am.map((m, i) => { const h = m.betrag / mx * 130, x = i * bw + bw * .22, w = bw * .56, y = 160 - h;
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="url(#bg1)" opacity="${m.monat === laufend ? .45 : 1}"/>
      <text x="${x + w / 2}" y="${y - 8}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--leise)">${eur(m.betrag, true)}</text>
      <text x="${x + w / 2}" y="182" text-anchor="middle" font-size="12" fill="var(--leise)">${monat(m.monat)}</text>` }).join('') + `</svg>`;
  // Top
  const top = (id, titel, l, video) => document.getElementById(id).innerHTML = `<h2>${titel}</h2>` + l.slice(0, 8).map((e, i) => {
    const s = (k.name === 'Alle Accounts' && e.konto ? esc(e.konto) + ' · ' : '') + zahl(e.bestellungen) + ' Bestellungen' + (video ? '' : ` · ${e.quote_prozent.toLocaleString('de-DE')} % n. b.`);
    const inner = `<span class="nr">${i + 1}</span><div class="mitte"><div class="n">${esc(e.name)}</div><div class="s">${s}</div></div><span class="b">${eur(e.betrag)}</span>`;
    return video && e.id && e.konto ? `<a class="zeile" href="https://www.tiktok.com/@${esc(e.konto)}/video/${esc(e.id)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="zeile">${inner}</div>` }).join('');
  top('videos', 'Top-Videos', k.videos, true); top('produkte', 'Top-Produkte', k.produkte, false);
  const of = document.getElementById('offen'); of.hidden = !k.offen.length;
  of.innerHTML = `<h2>Offene Bestellungen <small>${zahl(z.offen_anzahl)} gesamt</small></h2>` + k.offen.slice(0, 10).map(o =>
    `<div class="zeile"><div class="mitte"><div class="n">${esc(o.produkt)}</div><div class="s">${k.name === 'Alle Accounts' ? esc(o.konto) + ' · ' : ''}bestellt ${o.bestellt}</div></div><span class="b">${eur(o.betrag)}</span></div>`).join('');
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-k],[data-p]'); if (!b) return;
  if (b.dataset.k) st.konto = b.dataset.k; else st.per = b.dataset.p;
  merke(); zeichne(); if (b.dataset.k && b.classList.contains('zeile')) window.scrollTo({top: 0, behavior: 'smooth'});
});
zeichne();
</script>
