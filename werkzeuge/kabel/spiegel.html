<!doctype html>
<html lang="de"><meta charset="utf-8"><title>iPhone-Spiegel</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1c1e; color: #ddd; font: 13px -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  #bar { display: flex; gap: 6px; padding: 6px; align-items: center; }
  button { background: #3a3a3c; color: #eee; border: 0; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #info { opacity: .6; min-width: 12em; }
  #wrap { flex: 1; min-height: 0; display: flex; justify-content: center; padding-bottom: 8px; }
  img { height: 100%; border-radius: 18px; user-select: none; -webkit-user-drag: none; cursor: pointer; }
</style>
<div id="bar">
  <button data-key="home" title="Home (Taste Pos1)">Home</button>
  <button data-key="lock" title="Sperren">Sperre</button>
  <button data-key="volume_up">Lauter</button>
  <button data-key="volume_down">Leiser</button>
  <span id="info">verbinde …</span>
</div>
<div id="wrap"><img id="bild" alt="iPhone"></div>
<script>
// Klick = Tippen, gedrückt halten = langer Druck, ziehen = Wischen, Mausrad = Scrollen, Mac-Tastatur tippt am iPhone.
const $ = id => document.getElementById(id), img = $('bild'), info = $('info');
let dev = null, busy = Promise.resolve();
const api = async (p, body) => {
  const r = await fetch(p, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || d.message || r.status); return d;
};
// Wie app.js des Servers: immer auf das neueste Bild beziehen, einmal wiederholen, falls es älter als die letzte Eingabe ist.
const act = (operation, args = {}) => busy = busy.then(async () => {
  for (let i = 0; i < 3; i++) {
    const frame = (await api('/api/devices')).find(d => d.device_id === dev)?.frame_id;
    try { await api(`/api/devices/${dev}/action`, {operation, arguments: {expectedFrameID: frame, ...args}}); info.textContent = ''; return; }
    catch (e) { if (i == 2 || !/before your last action|frame/i.test(e.message)) { info.textContent = e.message; return; } await new Promise(r => setTimeout(r, 200)); }
  }
}).catch(e => info.textContent = e.message);

async function start() {
  try {
    const d = (await api('/api/devices')).find(d => d.frame_id) || null;
    if (!d) { info.textContent = 'kein Live-Bild – Kabel/Server prüfen'; return setTimeout(start, 2000); }
    dev = d.device_id; info.textContent = d.name;
    img.src = `/api/devices/${dev}/stream`;
  } catch (e) { info.textContent = 'Server aus? ' + e.message; setTimeout(start, 2000); }
}
img.onerror = () => { img.removeAttribute('src'); setTimeout(start, 1000); };

const pos = e => { const r = img.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
let down = null;
img.onpointerdown = e => { e.preventDefault(); img.setPointerCapture(e.pointerId); down = {p: pos(e), t: performance.now(), x: e.clientX, y: e.clientY}; };
img.onpointerup = e => {
  if (!down || !dev) return;
  const [x2, y2] = pos(e), [x1, y1] = down.p, ms = performance.now() - down.t;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6;
  down = null;
  if (!moved && ms < 400) act('pointer_tap', {x: x1, y: y1});
  else act('drag', {x1, y1, x2, y2, dauer: Math.min(3, Math.max(.05, ms / 1000))});  // langer Druck = Ziehen ohne Bewegung
};
let rad = 0, radTimer;
img.onwheel = e => {
  e.preventDefault(); rad += e.deltaY; clearTimeout(radTimer);
  radTimer = setTimeout(() => { const dy = Math.round(Math.max(-1200, Math.min(1200, rad))); rad = 0; if (dy && dev) act('scroll', {dy}); }, 120);
};
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => dev && act('send_key', {key: b.dataset.key}));

// Mac-Taste (physische Position) → HID-Code. Mac und iPhone haben beide deutsches Layout, also kommt jedes Zeichen richtig an.
// Mac-ISO-Tastatur: „<“ meldet Backquote, „^“ meldet IntlBackslash, „#“ meldet Backslash (Werte wie _DE in kabel.py).
const HID = {Enter: 0x28, Escape: 0x29, Backspace: 0x2a, Tab: 0x2b, Space: 0x2c, Minus: 0x2d, Equal: 0x2e,
  BracketLeft: 0x2f, BracketRight: 0x30, Backslash: 0x32, Semicolon: 0x33, Quote: 0x34, Backquote: 0x64,
  IntlBackslash: 0x35, Comma: 0x36, Period: 0x37, Slash: 0x38, Delete: 0x4c,
  ArrowRight: 0x4f, ArrowLeft: 0x50, ArrowDown: 0x51, ArrowUp: 0x52, Digit0: 0x27};
for (let i = 0; i < 26; i++) HID['Key' + String.fromCharCode(65 + i)] = 4 + i;
for (let i = 1; i < 10; i++) HID['Digit' + i] = 0x1d + i;
let tasten = [], tastenTimer;
document.onkeydown = e => {
  if (!dev) return;
  if (e.code === 'Home') { e.preventDefault(); return act('send_key', {key: 'home'}); }
  const u = HID[e.code]; if (!u) return;
  e.preventDefault();
  tasten.push([(e.ctrlKey ? 1 : 0) | (e.shiftKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0), u]);
  clearTimeout(tastenTimer);  // schnelles Tippen bündeln: ein Befehl statt einer pro Taste
  tastenTimer = setTimeout(() => { const keys = tasten; tasten = []; act('hid', {keys, halt: .03, pause: .015}); }, 60);
};
start();
</script>
</html>
